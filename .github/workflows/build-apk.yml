name: Build and Publish MoCall Private APK
on:
  push:
    branches:
      - mocall-personal
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Node 22 for signaling tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install signaling server dependencies
        run: npm install --prefix server --no-audit --no-fund
      - name: Test private signaling and authentication
        run: npm test --prefix server
      - name: Build Android APK (debug-signed test version)
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk MoCall-Private-v0.2.0.apk
      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoCall-Private-APK
          path: MoCall-Private-v0.2.0.apk
      - name: Publish direct APK in GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mocall-v0.2.0
          target_commitish: mocall-personal
          name: MoCall Private v0.2.0
          files: MoCall-Private-v0.2.0.apk
          body: "Self-hosted calling MVP: APK + browser guests, own signaling and optional TURN. Requires own HTTPS/WSS server. Debug-signed for personal testing only."
