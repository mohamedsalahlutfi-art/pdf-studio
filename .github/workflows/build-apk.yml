name: Build and Publish MoCall APK
on:
  push:
    branches:
      - mocall-personal
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build APK (debug-signed)
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Name downloadable file
        run: cp app/build/outputs/apk/debug/app-debug.apk MoCall-v0.1.0.apk
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoCall-APK
          path: MoCall-v0.1.0.apk
      - name: Publish direct APK download in Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mocall-v0.1.0
          name: MoCall Personal v0.1.0
          target_commitish: mocall-personal
          files: MoCall-v0.1.0.apk
          generate_release_notes: false
          body: 'Arabic-first personal meeting link app. APK is debug-signed for testing. Calls use Jitsi Meet; host login may be required.'
